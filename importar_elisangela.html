<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importar dados Elisangela — GPL</title>
<style>
body{font-family:system-ui,sans-serif;background:#f0f9e8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.box{background:#fff;border-radius:16px;padding:28px;max-width:400px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.12);text-align:center}
.logo{color:#1B5E20;font-size:22px;font-weight:800;margin-bottom:4px}
.sub{color:#888;font-size:13px;margin-bottom:24px}
.info{background:#E8F5E9;border-radius:10px;padding:14px;font-size:13px;color:#1B5E20;margin-bottom:20px;text-align:left;line-height:1.8}
.btn{width:100%;padding:14px;background:#1B5E20;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn:active{background:#155016}
.btn2{width:100%;padding:12px;background:#f5f5f5;color:#333;border:1px solid #ddd;border-radius:10px;font-size:14px;cursor:pointer}
.result{display:none;padding:16px;border-radius:10px;font-size:14px;font-weight:600;margin-top:16px}
.ok{background:#E8F5E9;color:#1B5E20;display:block}
.err{background:#FFEBEE;color:#C62828;display:block}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🌿 GPL — Importação</div>
  <div class="sub">Gestão Pecuária Lucrativa</div>
  <div class="info">
    <b>17 registros de cantina da Elisangela</b><br>
    📅 11/05 a 15/05/2026<br>
    💰 Total: R$ 950,00<br>
    🏠 Fazenda Estrela
  </div>
  <button class="btn" onclick="importar()">⬇️ Importar dados agora</button>
  <button class="btn2" onclick="window.location='https://gestaopecuarialucrativa-dotcom.github.io/fazenda-gpl/'">← Voltar para o GPL</button>
  <div class="result" id="result"></div>
</div>

<script>
var dados = [

];

function importar(){
  try {
    var S = JSON.parse(localStorage.getItem('gpl_v17_data') || '{}');
    if (!S.rC) S.rC = [];
    var adicionados = 0;
    dados.forEach(function(r){
      var existe = S.rC.some(function(x){
        return x.dt===r.dt && x.resp===r.resp && x.total===r.total && x.det===r.det;
      });
      if (!existe){ S.rC.push(r); adicionados++; }
    });
    localStorage.setItem('gpl_v17_data', JSON.stringify(S));
    var el = document.getElementById('result');
    el.className = 'result ok';
    el.innerHTML = '✅ ' + adicionados + ' registros importados!<br>Total cantina: R$ 950,00<br><br>'
      + '<a href="https://gestaopecuarialucrativa-dotcom.github.io/fazenda-gpl/" style="color:#1B5E20;font-weight:700">→ Abrir o GPL agora</a>';
  } catch(e) {
    var el = document.getElementById('result');
    el.className = 'result err';
    el.innerHTML = '❌ Erro: ' + e.message + '<br>Tente abrir esta página dentro do GPL.';
  }
}
</script>
</body>
</html>
