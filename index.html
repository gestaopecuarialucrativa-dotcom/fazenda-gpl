<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPL — Fazenda Lucraviva</title>
    <style>
        :root { --primary: #1B5E20; --bg: #f0f2f5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: #333; }
        .header { background: linear-gradient(135deg,#1a5c10,#2d7a1f); color: white; padding: 15px; text-align: center; font-weight: 800; font-size: 18px; position: sticky; top: 0; z-index: 100; }
        
        /* Menu Superior */
        .nav { display: flex; background: white; border-bottom: 1px solid #ddd; overflow-x: auto; position: sticky; top: 52px; z-index: 99; }
        .nav-item { flex: 1; padding: 15px 5px; text-align: center; font-size: 11px; font-weight: bold; color: #666; cursor: pointer; border-bottom: 3px solid transparent; min-width: 80px; }
        .nav-item.active { color: var(--primary); border-bottom-color: var(--primary); }

        .container { padding: 10px; display: none; }
        .container.active { display: block; }

        /* KPIs Estilo Segundo Print */
        .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
        .kpi { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .kpi-val { font-size: 22px; font-weight: 900; color: #1B5E20; }
        .kpi-lbl { font-size: 11px; color: #888; text-transform: uppercase; font-weight: 700; }

        /* Seções do Painel */
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .card-title { font-size: 13px; font-weight: 800; color: #1B5E20; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; text-transform: uppercase; }
        
        .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
        .row-name { font-size: 13px; font-weight: 700; color: #333; }
        .row-sub { font-size: 11px; color: #999; }
        .row-val { font-size: 14px; font-weight: 800; color: #1B5E20; }

        /* Estilo PIN */
        #login { position: fixed; inset: 0; background: var(--primary); z-index: 1000; display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; }
        .pin-box { background: white; padding: 25px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center; }
        .pin-box input { width: 100%; padding: 15px; font-size: 20px; text-align: center; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="login">
    <h2 style="margin-bottom:20px">GPL — ACESSO</h2>
    <div class="pin-box">
        <input type="password" id="pin" placeholder="PIN DE ACESSO" inputmode="numeric">
        <button onclick="logar()" style="width:100%; padding:15px; background:#2d7a1f; color:white; border:none; border-radius:10px; font-weight:bold">ENTRAR</button>
    </div>
</div>

<div id="app" style="display:none">
    <header class="header">GPL — FAZENDA LUCRAVIVA</header>
    <nav class="nav">
        <div class="nav-item active" onclick="guia(this, 'painel')">PAINEL</div>
        <div class="nav-item" onclick="guia(this, 'estoque')">ESTOQUE</div>
        <div class="nav-item" onclick="guia(this, 'lancamento')">LANÇAR</div>
        <div class="nav-item" onclick="guia(this, 'config')">CONFIG</div>
    </nav>

    <div id="painel" class="container active">
        <div class="kpis">
            <div class="kpi"><div class="kpi-lbl">Produção</div><div class="kpi-val" id="k-prod">0</div></div>
            <div class="kpi"><div class="kpi-lbl">Saldo Cantina</div><div class="kpi-val" id="k-cant">R$ 0</div></div>
        </div>

        <div class="card">
            <div class="card-title">🐄 Produção Recente</div>
            <div id="l-prod"></div>
        </div>

        <div class="card">
            <div class="card-title">🍴 Cantina (Últimos)</div>
            <div id="l-cant"></div>
        </div>

        <div class="card">
            <div class="card-title">📊 Escore Corporal</div>
            <div id="l-esc"></div>
        </div>
    </div>

    <div id="estoque" class="container">
        <div class="card"><div class="card-title">Itens em Estoque</div><div id="l-est"></div></div>
    </div>

    <div id="lancamento" class="container">
        <div class="card">
            <div class="card-title">Novo Registro</div>
            <select id="tipo" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px">
                <option value="Produção">Produção</option>
                <option value="Cantina">Cantina</option>
                <option value="Escore">Escore</option>
            </select>
            <input type="number" id="valor" placeholder="Valor / Qtd" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #ddd">
            <button onclick="salvar()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:bold">SALVAR</button>
        </div>
    </div>

    <div id="config" class="container">
        <button onclick="location.reload()" style="width:100%; padding:15px; background:#666; color:white; border:none; border-radius:8px; font-weight:bold">RECARREGAR / SAIR</button>
    </div>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbxaVjBYJ5_B9PaVDOjFN_ZZvuXBO0ksC_TB_QEP7NwgtYL4CVd04yEIjcv3OeK7lxe3YA/exec";

    function logar() {
        if(document.getElementById('pin').value === "2024") {
            document.getElementById('login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            carregar();
        } else { alert("PIN Inválido!"); }
    }

    function guia(el, id) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById(id).classList.add('active');
        if(id !== 'lancamento') carregar();
    }

    async function carregar() {
        try {
            const res = await fetch(URL + "?acao=carregar").then(r => r.json());
            
            // Produção
            let hP = "";
            if(res.Produção) {
                res.Produção.slice(1, 6).reverse().forEach(r => {
                    hP += `<div class="row"><div><div class="row-name">Leite</div><div class="row-sub">${r[0]}</div></div><div class="row-val">${r[1]}L</div></div>`;
                });
                document.getElementById('l-prod').innerHTML = hP;
                document.getElementById('k-prod').innerText = res.Produção[res.Produção.length-1][1] || 0;
            }

            // Cantina
            let hC = ""; let sC = 0;
            if(res.Cantina) {
                res.Cantina.slice(1).forEach(r => {
                    sC += parseFloat(r[1] || 0);
                    hC += `<div class="row"><div><div class="row-name">Gasto</div><div class="row-sub">${r[0]}</div></div><div class="row-val">R$ ${r[1]}</div></div>`;
                });
                document.getElementById('l-cant').innerHTML = hC;
                document.getElementById('k-cant').innerText = "R$ " + sC.toFixed(2);
            }

            // Estoque
            let hE = "";
            if(res.Estoque) {
                res.Estoque.slice(1).forEach(r => {
                    hE += `<div class="row"><div><div class="row-name">${r[0]}</div></div><div class="row-val">${r[1]}</div></div>`;
                });
                document.getElementById('l-est').innerHTML = hE;
            }
        } catch(e) { console.error(e); }
    }

    async function salvar() {
        const t = document.getElementById('tipo').value;
        const v = document.getElementById('valor').value;
        if(!v) return alert("Digite o valor!");
        await fetch(URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({tipo: t, valor: v}) });
        alert("Salvo!"); document.getElementById('valor').value = ""; carregar();
    }
</script>
</body>
</html>
